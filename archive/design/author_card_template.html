<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>作者卡片模板 · Author Card</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║ 作者卡片模板（自包含 / 可注入任意 HTML 工作流产物）          ║
  ║ 适用场景：单文件 HTML 报告、邮件、静态页、README 渲染等        ║
  ║ 关键点：图片用 base64 data-URI 内嵌，不依赖外部文件。          ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f5f1e8;display:flex;justify-content:center;padding:40px;}
  /* ── 卡片容器：控制整体边框/圆角/阴影，是“作者卡片”的外框 ── */
  .author-card{width:320px;background:#fff;border:1px solid #e3d9c4;border-radius:12px;
    padding:20px;box-shadow:0 4px 16px rgba(120,90,40,.12);text-align:center;}
  .author-card h3{margin:0 0 4px;color:#8a5a2b;font-size:18px;}   /* 标题：作者名/署名 */
  .author-card .sub{margin:0 0 14px;color:#999;font-size:12px;}   /* 副标题：一句话说明 */
  .qr{width:140px;height:140px;border:1px solid #ddd;border-radius:6px;object-fit:contain;} /* 二维码/头像图 */
  .links{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  .links a{flex:1;text-decoration:none;background:#8a5a2b;color:#fff;
    padding:8px 0;border-radius:6px;font-size:13px;}               /* 行动按钮：爱发电/GitHub */
  .note{margin-top:12px;color:#aaa;font-size:11px;}                /* 备注：不强求等语气 */
</style>
</head>
<body>
  <!-- ══ 作者卡片本体：复制下面整个 .author-card 块即可注入 ══ -->
